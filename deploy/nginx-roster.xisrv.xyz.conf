# cpanel-roster — https://roster.xisrv.xyz (REQ-2026-013 §5.2)
# Copiar a /etc/nginx/sites-available/roster.xisrv.xyz y enlazar en sites-enabled:
#   sudo cp deploy/nginx-roster.xisrv.xyz.conf /etc/nginx/sites-available/roster.xisrv.xyz
#   sudo ln -s /etc/nginx/sites-available/roster.xisrv.xyz /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d roster.xisrv.xyz   # emite/renueva el certificado
#   sudo nginx -t && sudo systemctl reload nginx
# xroster escucha solo en 127.0.0.1:3900 (XROSTER_BIND_ADDR); Nginx es el único punto de entrada público.

server {
    listen 80;
    listen [::]:80;
    server_name roster.xisrv.xyz;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roster.xisrv.xyz;

    ssl_certificate     /etc/letsencrypt/live/roster.xisrv.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roster.xisrv.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 64k;

    # Defensa en profundidad: el webhook interno de xBackend (X-Internal-Secret) jamás se expone a internet.
    location ^~ /internal/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3900;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
