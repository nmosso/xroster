# xRoster — contenedor aislado (RFC-2026-003 §4.1, Camino A).
# Portable a VM dedicada: solo cambian los valores de ../.env.roster
# (fuera del repo para que `git pull` nunca lo sobrescriba; copiar desde .env.example).
# Nota: la interpolación ${PORT}/${XROSTER_BIND_ADDR}/${SSH_KEY_HOST_PATH} de este archivo NO lee
# env_file; para usar esos valores: `docker compose --env-file ../.env.roster up -d --build`.
services:
  xroster:
    build:
      context: .
      args:
        INSTALL_CLAUDE_CLI: "true"
    image: xroster:latest
    container_name: xroster
    restart: unless-stopped
    env_file: ../.env.roster
    environment:
      NODE_ENV: production
    # Límites duros de recursos (1.0 vCPU / 1.5 GB RAM)
    cpus: "1.0"
    mem_limit: "1536m"
    ports:
      # Solo xBackend debe alcanzar el webhook; protegido además por X-Internal-Secret.
      - "${XROSTER_BIND_ADDR:-127.0.0.1}:${PORT:-3900}:${PORT:-3900}"
    volumes:
      - xplanning-data:/data/xPlanning
      - claude-home:/home/node/.claude
      - ${SSH_KEY_HOST_PATH:-./secrets/ssh_key}:/run/secrets/ssh_key:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xplanning-data:
  claude-home:
